name: loop_player
description: "A personal iOS music player with intelligent section looping."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Audio playback — AVFoundation-backed, streams position, supports MP3/M4A/WAV
  just_audio: ^0.10.5

  # Background audio + lock screen / Control Centre / headphone media controls
  audio_service: ^0.18.18

  # iOS AVAudioSession configuration and interruption handling
  audio_session: ^0.2.4

  # iOS Files picker for importing local audio files
  file_picker: ^13.0.0

  # Pick a cover photo from the iPhone Photos app (Edit song)
  image_picker: ^1.1.2

  # Local SQLite database for songs and loop profiles
  sqflite: ^2.4.5

  # App-sandboxed file paths (documents, support, temp directories)
  path_provider: ^2.1.6

  # Path manipulation utilities
  path: ^1.9.0

  # Audio metadata extraction (ID3v2 / MP4 tags, album art) — requires Rust toolchain
  # Waveform data extraction for the loop editor
  # State management
  flutter_riverpod: ^3.4.3

  # UUID generation for song IDs
  uuid: ^4.5.1
  audio_metadata_reader: ^1.8.1
  shared_preferences: ^2.5.6
  just_waveform: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Real SQLite inside `flutter test`, to test the database migration.
  sqflite_common_ffi: ^2.4.0+2

  # Riverpod code generation (optional — used if we add @riverpod annotations later)
  # riverpod_generator: ^4.0.9
  # build_runner: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
